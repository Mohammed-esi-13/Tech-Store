}

// ---- focus
let locked=null,chipSel=null;const status=document.getElementById("status");
const DEF="Click a table to see only its relationships. Drag to pan, scroll to zoom.";
function clearFocus(){Object.values(boxes).forEach(b=>b.classList.remove("dim"));edges.forEach(e=>{e.g.classList.remove("dim");e.path.classList.remove("hot")});status.textContent=DEF}
function focusTable(n,hover){
  const near=new Set([n]);let par=[],chi=[];
  edges.forEach(e=>{const r=e.r;
    if(r.ct===n){near.add(r.pt);if(r.pt!==n)par.push(r.pt)}
    if(r.pt===n){near.add(r.ct);if(r.ct!==n)chi.push(r.ct)}});
  for(const k in boxes)boxes[k].classList.toggle("dim",!near.has(k));
  edges.forEach(e=>{const hit=e.r.ct===n||e.r.pt===n;e.g.classList.toggle("dim",!hit);e.path.classList.toggle("hot",hit)});
  const u=a=>[...new Set(a)].join(", ")||"none";
  status.innerHTML=`<b>${n}</b> — depends on: ${u(par)} · referenced by: ${u(chi)}`+(hover?"":" (click again to release)");
}
function focusGroup(gi){
  const s=new Set(D.groups[gi].tables);
  for(const k in boxes)boxes[k].classList.toggle("dim",!s.has(k));
  edges.forEach(e=>{const hit=s.has(e.r.ct)&&s.has(e.r.pt)||s.has(e.r.ct)||s.has(e.r.pt);e.g.classList.toggle("dim",!hit);e.path.classList.remove("hot")});
  status.innerHTML=`<b>${D.groups[gi].name}</b> — ${D.groups[gi].tables.length} tables`;
}

// ---- legend chips
const chips=document.getElementById("chips");
D.groups.forEach((g,i)=>{
  const b=document.createElement("button");b.className="chip";b.setAttribute("aria-pressed","false");
  b.innerHTML=`<i style="background:${g.color}"></i>${g.name}`;
  b.onclick=()=>{
    if(chipSel===i){chipSel=null;b.setAttribute("aria-pressed","false");locked=null;clearFocus();return}
    [...chips.children].forEach(c=>c.setAttribute("aria-pressed","false"));
    chipSel=i;locked="chip";b.setAttribute("aria-pressed","true");focusGroup(i);
  };
  chips.appendChild(b);
});
stage.addEventListener("click",()=>{if(moved)return;locked=null;chipSel=null;[...chips.children].forEach(c=>c.setAttribute("aria-pressed","false"));clearFocus()});

// ---- pan / zoom
let k=1,tx=0,ty=0,moved=false;
function apply(){vp.setAttribute("transform",`translate(${tx},${ty}) scale(${k})`)}
function fit(){const r=stage.getBoundingClientRect();k=Math.min(r.width/W,r.height/H)*0.98;tx=(r.width-W*k)/2;ty=(r.height-H*k)/2;apply()}
function zoomAt(f,cx,cy){const nk=Math.min(3,Math.max(.12,k*f));tx=cx-(cx-tx)*(nk/k);ty=cy-(cy-ty)*(nk/k);k=nk;apply()}
stage.addEventListener("wheel",e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top)},{passive:false});
const ptrs=new Map();let sx,sy,stx,sty,pd=0;
stage.addEventListener("pointerdown",e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);moved=false;
  if(ptrs.size===1){sx=e.clientX;sy=e.clientY;stx=tx;sty=ty}
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pd=Math.hypot(a[0]-b[0],a[1]-b[1])}});
stage.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptrs.size===2){const [a,b]=[...ptrs.values()],nd=Math.hypot(a[0]-b[0],a[1]-b[1]);const r=stage.getBoundingClientRect();
    if(pd)zoomAt(nd/pd,(a[0]+b[0])/2-r.left,(a[1]+b[1])/2-r.top);pd=nd;moved=true;return}
  const dx=e.clientX-sx,dy=e.clientY-sy;
  if(!moved&&Math.hypot(dx,dy)>5){moved=true;stage.classList.add("drag")}
  if(moved&&ptrs.size===1){tx=stx+dx;ty=sty+dy;apply()}});
const up=e=>{ptrs.delete(e.pointerId);pd=0;stage.classList.remove("drag");if(ptrs.size===1){const [a]=[...ptrs.values()];sx=a[0];sy=a[1];stx=tx;sty=ty}setTimeout(()=>moved=false,0)};
stage.addEventListener("pointerup",up);stage.addEventListener("pointercancel",up);
const cc=()=>{const r=stage.getBoundingClientRect();return[r.width/2,r.height/2]};
document.getElementById("zin").onclick=()=>zoomAt(1.25,...cc());
document.getElementById("zout").onclick=()=>zoomAt(1/1.25,...cc());
document.getElementById("fit").onclick=fit;
window.addEventListener("resize",fit);
fit();
</script>
</body>
